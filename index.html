      tableH:'Detalle mensual', tableNote:'sep 2026 parcial · «salieron» = fase actual fuera del buzón a día de hoy',
      thMonth:'Mes', thRecv:'Recibidas', thLeft:'Salieron del buzón', thPct:'% real', thRep:'Cr. reportes', thCall:'Cr. llamadas', thTotal:'Cr. total',
      partial:'parcial', received:'recibidas', left:'salieron', total:'total',
      pH:'Datos del prospect', pNote:'elige el tamaño y se rellenan las medianas del mercado · ajusta lo que sepas',
      pSize:'Tamaño de la empresa', pRecv:'Candidaturas recibidas', perMonth:'/ mes', pRecvHint:'mediana del tramo por defecto',
      pRate:'Tasa de paso', pRateHint:'candidatos que salen del buzón inicial',
      tierHint:(n,m,r)=>`${n} clientes en el tramo · mediana ${m} recibidas/mes · tasa ${r}`,
      xRecv:'Candidaturas / mes', xRecvSub:'cada una genera un reporte de IA', xAdv:'Salen del buzón / mes',
      refH:'Referencia del mercado por tramo', refNote:'medianas reales de clientes Factorial',
      thCompanies:'Empresas', thRecvMo:'Recibidas / mes', thRate:'Tasa de paso', thCrMo:'Cr. / mes', thCrYr:'Cr. / año',
      tiers:{'1-10':'1–10 seats','11-50':'11–50 seats','51-200':'51–200 seats','201-500':'201–500 seats','501-1000':'501–1.000 seats','1000+':'1.000+ seats','none':'Sin dato de seats','all':'Todo el mercado'},
      months:['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],
      callsH:'Llamadas de IA reales por empresa', callsNote:'desde el 6 ago 2026 · producción',
      callsSub:'Las llamadas del estimador son modeladas a partir de los candidatos que salen del buzón; no incluyen llamadas reales ni de test. Esta tabla muestra las llamadas de IA que sí se han hecho. Las <b>llamadas de test</b> son las del botón de prueba en los ajustes del job: llamadas web con un candidato ficticio, sin candidatura asociada. Las <b>llamadas a candidatos</b> son telefónicas y van ligadas a una candidatura real.',
      thCompany:'Empresa', thTestCalls:'Llamadas de test', thTestMin:'Min. test', thPhoneCalls:'Llamadas a candidatos', thCands:'Candidatos llamados', thCompleted:'Completadas', thPhoneMin:'Min. candidatos', thLastCall:'Última llamada',
      footer:'<b>Metodología.</b> Fuente <code>aws_prod_data_glue_catalog</code> vía Trino, tablas <code>bronze.ats_applications</code> y <code>bronze.ats_application_phases</code> deduplicadas por CDC. <b>Recibidas</b>: candidaturas por mes de <code>created_at</code>, sep 2025 → 10 sep 2026. <b>Salen del buzón</b>: fase actual con <code>phase_type ≠ \'initial\'</code>. <b>Base mensual del cliente</b>: media de recibidas en jun–ago 2026. <b>Tasa de paso del cliente</b>: salieron / recibidas en sep 2025–may 2026 (meses maduros, para evitar el sesgo de recencia); si el cliente tiene menos de 30 candidaturas en ese periodo se usa la tasa agregada de su tramo. <b>Tramos</b>: seats del último mes disponible en <code>gold.customers_monthly</code>. Excluidas de las medianas las empresas 1, 324209 y 315537 (cargas masivas); la cuenta de pruebas 65466 está excluida de todo el dataset. <b>Llamadas reales</b>: <code>bronze.integrations_retell_calls</code> cruzada con <code>bronze.ats_ai_call_results</code>; test = <code>call_type = \'web_call\'</code>, candidatos = <code>phone_call</code>. Consumo calculado con el modelo interno de créditos de One. Generado 2026-09-10.'
    },
    en: {
      locale:'en-US',
      title:'How many One credits will the customer use per month in recruitment?',
      sub:'Estimate based on the candidates each company receives in the ATS. Every application that comes in generates an <b>AI report</b>; every candidate who leaves the initial inbox gets an <b>AI call</b>. Consumption is computed with One\'s internal credit model.',
      tabClient:'Customer with data', tabProspect:'Prospect without data',
      count:n=>`${n} companies with applications since Sep 2025`,
      whoEmpty:'Enter a company id', whoEmptyMeta:'Type the id or part of the name; the list suggests matches.',
      whoNone:'No data', whoNoneMeta:id=>`No applications for id ${id} since Sep 2025. Use the Prospect tab.`,
      company:'Company', seats:'seats', tier:'tier', noSeats:'no seat data',
      warnRate:(n,t,r)=>`Only <b>${n}</b> applications between Sep 2025 and May 2026: the customer\'s own advance rate is not reliable, so the <b>${t}</b> tier rate is used (${r}).`,
      warnZero:'<b>No applications in Jun–Aug 2026.</b> The base consumption is zero; check whether the customer still uses the ATS.',
      kCredits:'Estimated credits / month', perYear:v=>`${v} cr./year`,
      kRecv:'Applications received / month', kRecvSub:'Jun–Aug 2026 average',
      kRate:'Advance rate to next stage', rateOwn:(a,r)=>`own · ${a} of ${r} (Sep 25–May 26)`, rateTier:t=>`${t} tier rate`,
      kAdv:'Candidates leaving the inbox / month', kAdvSub:'get the AI call',
      billH:'Where the bill comes from', billNoteC:'reports vs. calls · typical month', billNoteX:'reports vs. calls',
      reports:'Reports', calls:'Calls',
      chartH:'Estimated consumption month by month', chartNote:'actual volume of each month · customer\'s own advance rate', chartAria:'Estimated credits per month',
      tableH:'Monthly detail', tableNote:'Sep 2026 partial · “left inbox” = current stage outside the inbox as of today',
      thMonth:'Month', thRecv:'Received', thLeft:'Left inbox', thPct:'Actual %', thRep:'Report cr.', thCall:'Call cr.', thTotal:'Total cr.',
      partial:'partial', received:'received', left:'left inbox', total:'total',
      pH:'Prospect details', pNote:'pick the size and market medians fill in · adjust what you know',
      pSize:'Company size', pRecv:'Applications received', perMonth:'/ month', pRecvHint:'tier median by default',
      pRate:'Advance rate', pRateHint:'candidates who leave the initial inbox',
      tierHint:(n,m,r)=>`${n} customers in the tier · median ${m} received/month · rate ${r}`,
      xRecv:'Applications / month', xRecvSub:'each generates an AI report', xAdv:'Leave the inbox / month',
      refH:'Market reference by tier', refNote:'real medians of Factorial customers',
      thCompanies:'Companies', thRecvMo:'Received / month', thRate:'Advance rate', thCrMo:'Cr. / month', thCrYr:'Cr. / year',
      tiers:{'1-10':'1–10 seats','11-50':'11–50 seats','51-200':'51–200 seats','201-500':'201–500 seats','501-1000':'501–1,000 seats','1000+':'1,000+ seats','none':'No seat data','all':'Whole market'},
      months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
      callsH:'Real AI calls by company', callsNote:'since 6 Aug 2026 · production',
      callsSub:'The estimator\'s calls are modelled from candidates who leave the inbox; they include neither real nor test calls. This table shows the AI calls that actually happened. <b>Test calls</b> come from the test button in the job settings: web calls with a mock candidate and no application attached. <b>Candidate calls</b> are phone calls tied to a real application.',
      thCompany:'Company', thTestCalls:'Test calls', thTestMin:'Test min.', thPhoneCalls:'Candidate calls', thCands:'Candidates called', thCompleted:'Completed', thPhoneMin:'Candidate min.', thLastCall:'Last call',
      footer:'<b>Methodology.</b> Source <code>aws_prod_data_glue_catalog</code> via Trino, tables <code>bronze.ats_applications</code> and <code>bronze.ats_application_phases</code>, CDC-deduplicated. <b>Received</b>: applications by month of <code>created_at</code>, Sep 2025 → 10 Sep 2026. <b>Left inbox</b>: current stage with <code>phase_type ≠ \'initial\'</code>. <b>Customer monthly base</b>: average applications received in Jun–Aug 2026. <b>Customer advance rate</b>: left inbox / received over Sep 2025–May 2026 (matured months, to avoid recency bias); customers with fewer than 30 applications in that window use their tier\'s pooled rate. <b>Tiers</b>: seats from the latest month available in <code>gold.customers_monthly</code>. Companies 1, 324209 and 315537 (bulk loads) are excluded from the medians; the test account 65466 is excluded from the whole dataset. <b>Real calls</b>: <code>bronze.integrations_retell_calls</code> joined with <code>bronze.ats_ai_call_results</code>; test = <code>call_type = \'web_call\'</code>, candidates = <code>phone_call</code>. Consumption computed with One\'s internal credit model. Generated 2026-09-10.'
    }
  };
  let L = I18N.es, nf0, nf1;
  const pct = v => nf1.format(v*100) + (L === I18N.es ? ' %' : '%');
  const mlabel = m => L.months[parseInt(m.slice(5),10)-1] + ' ' + m.slice(2,4);
  const tierLabel = k => L.tiers[k];

  function applyStatic(){
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = L[el.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = L[el.dataset.i18nHtml]; });
    document.documentElement.lang = L === I18N.es ? 'es' : 'en';
    $('c-chart').setAttribute('aria-label', L.chartAria);
    $('c-count').textContent = L.count(nf0.format(D.companies.length));
    Array.from($('x-tier').options).forEach(o => { o.textContent = tierLabel(o.value); });
  }
  function setLang(code){
    L = I18N[code]; nf0 = new Intl.NumberFormat(L.locale, {maximumFractionDigits:0}); nf1 = new Intl.NumberFormat(L.locale, {maximumFractionDigits:1});
    $('lang-es').setAttribute('aria-pressed', String(code==='es')); $('lang-en').setAttribute('aria-pressed', String(code==='en'));
    applyStatic(); fillTierHint(); renderClient(); renderProspect(); renderCalls();
    try { localStorage.setItem('one-credits-lang', code); } catch(e){}
  }

  function tierOf(seats){
    if (seats == null) return 'none';
    if (seats <= 10) return '1-10'; if (seats <= 50) return '11-50'; if (seats <= 200) return '51-200';
    if (seats <= 500) return '201-500'; if (seats <= 1000) return '501-1000'; return '1000+';
  }
  /** Credits for one month given received volume and advance rate. */
  function credits(recv, rate){
    const rep = P.adopt * recv * P.report;
    const call = P.adopt * recv * rate * P.contact * P.min * P.cpm;
    return { rep, call, total: rep + call };
  }
  function renderSplit(splitId, legendId, c){
    const s = $(splitId); const tot = c.total || 1;
    s.children[0].style.width = (c.rep/tot*100) + '%';
    s.children[1].style.width = (c.call/tot*100) + '%';
    $(legendId).innerHTML = `<span><i style="background:var(--rep)"></i>${L.reports} <b>${nf0.format(c.rep)} cr.</b> · ${nf0.format(c.rep/tot*100)}%</span><span><i style="background:var(--call)"></i>${L.calls} <b>${nf0.format(c.call)} cr.</b> · ${nf0.format(c.call/tot*100)}%</span>`;
  }

  /* ---------- Customer ---------- */
  const list = $('company-list');
  const frag = document.createDocumentFragment();
  for (const c of D.companies){ const o = document.createElement('option'); o.value = c[0]; o.label = c[1] ? `${c[0]} · ${c[1]}` : String(c[0]); frag.appendChild(o); }
  list.appendChild(frag);

  function clientModel(c){
    const recv = c[3], adv = c[4];
    const base = (recv[9] + recv[10] + recv[11]) / 3;
    const mr = recv.slice(0,9).reduce((a,b)=>a+b,0), ma = adv.slice(0,9).reduce((a,b)=>a+b,0);
    const tier = tierOf(c[2]);
    const own = mr >= 30;
    const rate = own ? ma/mr : T[tier].rate;
    return { base, rate, own, mr, ma, tier };
  }

  function renderClient(){
    const raw = $('c-id').value.trim();
    const c = byId.get(raw);
    const who = $('c-who'), warn = $('c-warn'), res = $('c-result');
    if (!c){
      who.innerHTML = raw ? `<b>${L.whoNone}</b><span class="meta">${L.whoNoneMeta(raw)}</span>` : `<b>${L.whoEmpty}</b><span class="meta">${L.whoEmptyMeta}</span>`;
      warn.innerHTML = ''; res.hidden = true; return;
    }
    res.hidden = false;
    const m = clientModel(c);
    who.innerHTML = `<b>${c[1] || L.company + ' ' + c[0]}</b><span class="meta">id ${c[0]} · ${c[2] != null ? nf0.format(c[2]) + ' ' + L.seats + ' · ' + L.tier + ' ' + tierLabel(m.tier) : L.noSeats}</span>`;
    const notes = [];
    if (!m.own) notes.push(L.warnRate(nf0.format(m.mr), tierLabel(m.tier), pct(T[m.tier].rate)));
    if (m.base === 0) notes.push(L.warnZero);
    warn.innerHTML = notes.length ? `<div class="warn">${notes.join(' ')}</div>` : '';

    const cr = credits(m.base, m.rate);
    const advMo = m.base * m.rate;
    $('c-credits').textContent = nf0.format(cr.total);
    $('c-year').textContent = L.perYear(nf0.format(cr.total*12));
    $('c-recv').textContent = nf0.format(m.base);
    $('c-rate').textContent = pct(m.rate);
    $('c-rate-src').textContent = m.own ? L.rateOwn(nf0.format(m.ma), nf0.format(m.mr)) : L.rateTier(tierLabel(m.tier));
    $('c-adv').textContent = nf0.format(advMo);
    renderSplit('c-split','c-legend',cr);

    const series = M.map((mo,i) => ({ m:mo, recv:c[3][i], adv:c[4][i], ...credits(c[3][i], m.rate), partial: i === M.length-1 }));
    drawBars(series);
    $('c-table').innerHTML = series.map(s => `<tr class="${s.partial?'partial':''}"><td>${mlabel(s.m)}${s.partial?' ('+L.partial+')':''}</td><td>${nf0.format(s.recv)}</td><td>${nf0.format(s.adv)}</td><td>${s.recv? pct(s.adv/s.recv):'—'}</td><td>${nf0.format(s.rep)}</td><td>${nf0.format(s.call)}</td><td><b>${nf0.format(s.total)}</b></td></tr>`).join('');
  }

  function drawBars(series){
    const svg = $('c-chart'); const W=900, H=300, Lm=56, R=16, TOP=18, B=34;
    const iw = W-Lm-R, ih = H-TOP-B; const n = series.length;
    const max = Math.max(1, ...series.map(s=>s.total));
    const nice = niceMax(max); const y = v => TOP + ih - v/nice*ih;
    const slot = iw/n, bw = Math.min(46, slot*0.62);
    let out = '';
    const ticks = 4;
    for (let t=0;t<=ticks;t++){ const v = nice*t/ticks; out += `<line x1="${Lm}" y1="${y(v).toFixed(1)}" x2="${W-R}" y2="${y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${Lm-8}" y="${y(v).toFixed(1)}" font-size="11" text-anchor="end" dominant-baseline="middle">${fmtK(v)}</text>`; }
    series.forEach((s,i) => {
      const x = Lm + slot*i + (slot-bw)/2;
      const yRep = y(s.rep), yCall = y(s.total);
      const op = s.partial ? 0.45 : 1;
      out += `<g class="bar" data-i="${i}" opacity="${op}">`;
      out += `<rect x="${x.toFixed(1)}" y="${yRep.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,(y(0)-yRep)).toFixed(1)}" fill="var(--rep)"/>`;
      if (s.call > 0) out += `<rect x="${x.toFixed(1)}" y="${yCall.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,(yRep-yCall-2)).toFixed(1)}" fill="var(--call)" rx="3"/>`;
      out += `<rect x="${(Lm+slot*i).toFixed(1)}" y="${TOP}" width="${slot.toFixed(1)}" height="${ih}" fill="transparent"/>`;
      out += `</g>`;
      out += `<text x="${(x+bw/2).toFixed(1)}" y="${H-12}" font-size="10.5" text-anchor="middle">${mlabel(s.m)}</text>`;
    });
    svg.innerHTML = out;
    const tip = $('c-tip'); const box = svg.parentElement;
    svg.querySelectorAll('g.bar').forEach(g => {
      g.addEventListener('mousemove', e => {
        const s = series[+g.dataset.i]; const r = box.getBoundingClientRect();
        tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top - 8) + 'px';
        tip.innerHTML = `<b>${mlabel(s.m)}${s.partial?' · '+L.partial:''}</b> · ${nf0.format(s.recv)} ${L.received} · ${nf0.format(s.adv)} ${L.left}<br>${L.reports.toLowerCase()} ${nf0.format(s.rep)} · ${L.calls.toLowerCase()} ${nf0.format(s.call)} · ${L.total} <b>${nf0.format(s.total)}</b> cr.`;
        tip.style.opacity = 1;
      });
      g.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
    });
  }
  function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v/p; const s = m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10; return s*p; }
  function fmtK(v){ return v>=1000 ? nf1.format(v/1000)+'k' : nf0.format(v); }

  /* ---------- Prospect ---------- */
  const sel = $('x-tier');
  for (const k of [...TIER_ORDER,'all']){ const o = document.createElement('option'); o.value = k; sel.appendChild(o); }
  sel.value = '51-200';
  function fillTierHint(){
    const t = T[sel.value];
    $('x-tier-hint').textContent = L.tierHint(nf0.format(t.n), nf1.format(t.medRecv), pct(t.rate));
  }
  function fillFromTier(){
    const t = T[sel.value];
    $('x-recv').value = Math.round(t.medRecv);
    $('x-rate').value = Math.round(t.rate*100);
    fillTierHint();
  }
  function renderProspect(){
    const recv = Math.max(0, parseFloat($('x-recv').value) || 0);
    const rate = Math.min(100, Math.max(0, parseFloat($('x-rate').value) || 0))/100;
    const cr = credits(recv, rate);
    $('x-credits').textContent = nf0.format(cr.total);
    $('x-year').textContent = L.perYear(nf0.format(cr.total*12));
    $('x-recv-k').textContent = nf0.format(recv);
    $('x-adv').textContent = nf0.format(recv*rate);
    renderSplit('x-split','x-legend',cr);
    $('x-table').innerHTML = TIER_ORDER.map(k => { const t = T[k]; const c = credits(t.medRecv, t.rate);
      return `<tr class="${k===sel.value?'hl':''}"><td>${tierLabel(k)}</td><td>${nf0.format(t.n)}</td><td>${nf1.format(t.medRecv)}</td><td>${pct(t.rate)}</td><td>${nf0.format(c.rep)}</td><td>${nf0.format(c.call)}</td><td><b>${nf0.format(c.total)}</b></td><td>${nf0.format(c.total*12)}</td></tr>`; }).join('');
  }

  /* ---------- Real calls ---------- */
  function renderCalls(){
    const fmtD = s => { const d = new Date(s.replace(' ','T')); return d.toLocaleDateString(L.locale, {day:'numeric', month:'short'}); };
    $('calls-table').innerHTML = D.calls.map(r => `<tr><td><b>${r[1] || L.company + ' ' + r[0]}</b> <span style="color:var(--muted)">· ${r[0]}</span></td><td>${nf0.format(r[2])}</td><td>${r[6] != null ? nf1.format(+r[6]) : '—'}</td><td>${nf0.format(r[3])}</td><td>${nf0.format(r[4])}</td><td>${nf0.format(r[5])}</td><td>${r[7] != null ? nf1.format(+r[7]) : '—'}</td><td>${fmtD(r[9])}</td></tr>`).join('');
  }

  /* ---------- wiring ---------- */
  $('c-id').addEventListener('input', renderClient);
  sel.addEventListener('change', () => { fillFromTier(); renderProspect(); });
  ['x-recv','x-rate'].forEach(id => $(id).addEventListener('input', renderProspect));
  $('lang-es').addEventListener('click', () => setLang('es'));
  $('lang-en').addEventListener('click', () => setLang('en'));
  const tabs = [['tab-client','pane-client'],['tab-prospect','pane-prospect']];
  tabs.forEach(([t]) => $(t).addEventListener('click', () => {
    tabs.forEach(([t2,p2]) => { $(t2).setAttribute('aria-selected', String(t2===t)); $(p2).hidden = t2!==t; });
    try { localStorage.setItem('one-credits-tab', t); } catch(e){}
  }));
  try { const t = localStorage.getItem('one-credits-tab'); if (t === 'tab-prospect') $(t).click(); } catch(e){}
  try { const last = localStorage.getItem('one-credits-id'); if (last && byId.has(last)) $('c-id').value = last; } catch(e){}
  $('c-id').addEventListener('change', () => { try { localStorage.setItem('one-credits-id', $('c-id').value.trim()); } catch(e){} });
  if (!$('c-id').value) $('c-id').value = '265105';
  const t51 = T['51-200']; $('x-recv').value = Math.round(t51.medRecv); $('x-rate').value = Math.round(t51.rate*100);
  let lang = 'es'; try { lang = localStorage.getItem('one-credits-lang') || 'es'; } catch(e){}
  setLang(I18N[lang] ? lang : 'es');
})();
</script>
